name: EchoNet CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .[dev]

      - name: Validate schemas and examples
        run: python scripts/validate_examples.py

      - name: Run tests
        run: python -m pytest -q

      - name: Exercise CLI validation paths
        run: |
          echonet validate examples/
          echonet validate fixtures/memory_layer fixtures/navigator fixtures/aethernode fixtures/echochain
          echonet validate examples/ai_witness_dataset_example.json --schema ai_witness
